function applyChartDefaults(){ Chart.defaults.color=document.documentElement.classList.contains("dark")?CHART_COLOR_DARK:CHART_COLOR_LIGHT; }
function toggleDark(){
  const on=document.documentElement.classList.toggle("dark");
  localStorage.setItem("demoDark",on?"1":"0");

  applyChartDefaults();

// ── Window / Quarter ───────────────────────────────────────────────────────

function setQuarter(v){
  localStorage.setItem("demoQuarter",v);
  document.getElementById("windowSel").disabled=!!v;
  render();
}
function getActiveQuarterRange(){
  const s=localStorage.getItem("demoQuarter")||"";
  if(!s) return null;
  const [q,yr]=s.split(":").map(Number);
  const starts=[0,3,6,9], m=starts[q-1], endM=m+2;
  const pad=n=>String(n).padStart(2,"0");
  return {start:`${yr}-${pad(m+1)}-01`,end:`${yr}-${pad(endM+1)}-${new Date(yr,endM+1,0).getDate()}`};
}
function populateQuarterDropdown(){
  const sel=document.getElementById("quarterSel"); if(!sel) return;
  const now=new Date(), curQ=Math.floor(now.getMonth()/3)+1, curYr=now.getFullYear();
  sel.add(new Option("All (rolling)",""));
  for(let i=-2;i<=3;i++){
    let q=curQ+i, yr=curYr;
    while(q<1){q+=4;yr--;} while(q>4){q-=4;yr++;}
    sel.add(new Option(`Q${q} ${String(yr).slice(2)}`,`${q}:${yr}`));
  }
  const saved=localStorage.getItem("demoQuarter")||"";
  sel.value=saved;
  document.getElementById("windowSel").disabled=!!saved;

// ── Pipeline filtering ─────────────────────────────────────────────────────
function getWindowedRenewals(){
  const qr=getActiveQuarterRange();
  const todayStr=TODAY.toISOString().slice(0,10);
  if(qr){
    return RAW_RENEWALS.filter(r=>r.close>=qr.start&&r.close<=qr.end);
  }
  const futureCut=daysFrom(DAYS_WINDOW);
  return RAW_RENEWALS.filter(r=>{
    if(r.stage==="Closed Won") return r.close>=daysFrom(-90)&&r.close<=todayStr;
    if(r.stage==="Sales Complete") return r.close>=todayStr&&r.close<=futureCut;
    if(r.close<todayStr) return r.close>=daysFrom(-90); // overdue open
    return r.close<=futureCut;
  });
}

// ── Milestone logic (mirrors real dashboard) ───────────────────────────────
function daysUntil(d){ const t=new Date(TODAY); t.setHours(0,0,0,0); return Math.round((new Date(d+"T00:00:00")-t)/86400000); }
function getMilestone(cd){
  const d=daysUntil(cd);
  if(d<0)  return {label:"OVERDUE",level:0,css:"badge-overdue"};
  if(d<=30) return {label:"T-30",level:1,css:"badge-t30"};
  if(d<=60) return {label:"T-60",level:2,css:"badge-t60"};
  if(d<=90) return {label:"T-90",level:3,css:"badge-t90"};
  if(d<=120)return {label:"T-120",level:4,css:"badge-t120"};
  if(d<=145)return {label:"T-145",level:5,css:"badge-t145"};
  return {label:"Early",level:6,css:"badge-early"};
}

const MIN_STAGE={0:5,1:4,2:3,3:2,4:1,5:0,6:0};
function getPace(cd,stage){
  const m=getMilestone(cd), r=STAGE_RANK[stage]??-1;
  if(r<0||m.level===0) return {label:"N/A",css:"badge-na",behind:false};
  return r<MIN_STAGE[m.level]
    ? {label:"Behind",css:"badge-behind",behind:true}
    : {label:"On Track",css:"badge-ontrack",behind:false};
}
function getConfidence(r){
  const isWon=r.stage==="Closed Won", isDone=r.stage==="Sales Complete";
  if(isWon)  return {label:"Closed Won",tier:"committed",css:"conf-committed"};
  if(isDone) return {label:"Committed",tier:"committed",css:"conf-committed"};
  if(r.atRisk||r.overdueAR>0) return {label:"At Risk",tier:"atrisk",css:"conf-atrisk"};
  const p=getPace(r.close,r.stage);
  if(p.behind) return {label:"Watch",tier:"watch",css:"conf-watch"};
  const m=getMilestone(r.close);
  if(m.level>=3) return {label:"On Track",tier:"ontrack",css:"conf-ontrack"};
  return {label:"Watch",tier:"watch",css:"conf-watch"};
}

// ── Enrich ─────────────────────────────────────────────────────────────────
function enrich(renewals){
  return renewals.map(r=>({
    ...r,
    _milestone: getMilestone(r.close),
    _pace:      getPace(r.close, r.stage),
    _confidence:getConfidence(r),
    _behind:    getPace(r.close,r.stage).behind,
    _daysUntil: daysUntil(r.close),
  }));
}

// ── Chart helpers ──────────────────────────────────────────────────────────
const _charts={};
function mkChart(id,cfg){
  if(_charts[id]){_charts[id].destroy();delete _charts[id];}
  const canvas=document.getElementById(id); if(!canvas)return null;
  const c=new Chart(canvas,cfg); _charts[id]=c; return c;
}
function mkStripes(fg,bg){
  const cv=document.createElement("canvas"); cv.width=12;cv.height=12;
  const x=cv.getContext("2d");
  x.fillStyle=bg; x.fillRect(0,0,12,12);
  x.strokeStyle=fg; x.lineWidth=3; x.beginPath(); x.moveTo(0,12); x.lineTo(12,0); x.stroke();
  return document.createElement("canvas").getContext("2d").createPattern?
    (()=>{const c2=document.createElement("canvas");c2.width=12;c2.height=12;const x2=c2.getContext("2d");x2.fillStyle=bg;x2.fillRect(0,0,12,12);x2.strokeStyle=fg;x2.lineWidth=3;x2.beginPath();x2.moveTo(0,12);x2.lineTo(12,0);x2.stroke();return x2.createPattern(c2,"repeat");})()
    : fg;
}

const fmtK = v => v>=1000000?`$${(v/1000000).toFixed(1)}M`:`$${(v/1000).toFixed(0)}K`;
const fmtDt = s => s?new Date(s+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"—";

// ── Render ─────────────────────────────────────────────────────────────────
let _savedFilters={};
function render(){
  const renewals=getWindowedRenewals();
  const enriched=enrich(renewals);
  const qr=getActiveQuarterRange();
  const windowLabel=qr?`Q${localStorage.getItem("demoQuarter").split(":")[0]} ${localStorage.getItem("demoQuarter").split(":")[1]} filter`:`${DAYS_WINDOW}-day window`;
  document.getElementById("metaText").textContent=`Demo Mode · ${enriched.length} renewals · ${windowLabel}`;

  // Aggregate stats
  const open=enriched.filter(r=>r.stage!=="Closed Won"&&r.stage!=="Closed Lost");
  const totalARR=open.reduce((s,r)=>s+r.arr,0);
  const committed=enriched.filter(r=>r.stage==="Sales Complete"||r.stage==="Closed Won").reduce((s,r)=>s+r.arr,0);
  const behind=open.filter(r=>r._behind).length;
  const urgent=open.filter(r=>r._milestone.level===1&&r._behind).length;
  const atRiskCount=open.filter(r=>r.atRisk||r.overdueAR>0).length;

  // Charts data
  const byProduct={}, byStage={};
  open.forEach(r=>{
    byProduct[r.product]=(byProduct[r.product]||0)+r.arr;
    byStage[r.stage]=(byStage[r.stage]||0)+1;
  });
  const prodLabels=Object.keys(byProduct).sort((a,b)=>byProduct[b]-byProduct[a]);
  const stageOrder=["Discovery","Requirements","Proposal","Negotiation","Procurement","Sales Complete"];
  const stageLabels=Object.keys(byStage).sort((a,b)=>{const ia=stageOrder.indexOf(a),ib=stageOrder.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib);});

  // Monthly trend (last 6 months)
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(TODAY); d.setMonth(d.getMonth()-i);
    months.push({label:d.toLocaleDateString(undefined,{month:"short",year:"2-digit"}),yr:d.getFullYear(),mo:d.getMonth()+1});
  }
  const monthlyARR=months.map(m=>enriched.filter(r=>r.stage==="Closed Won"&&new Date(r.close).getFullYear()===m.yr&&new Date(r.close).getMonth()+1===m.mo).reduce((s,r)=>s+r.arr,0)||Math.random()*300000+80000);

  const _dm=document.documentElement.classList.contains("dark");

  // Live owners for dropdown
  const liveOwners=[...new Set(enriched.map(r=>r.owner))].sort();

  const saved=_savedFilters;
  document.getElementById("content").innerHTML=`
  <div class="cards">
    <div class="card orange"><div class="lbl">Open Pipeline ARR</div><div class="val">${fmtK(totalARR)}</div><div class="sub">${open.length} open renewals · ${windowLabel}</div></div>
    <div class="card green"><div class="lbl">Committed ARR</div><div class="val">${fmtK(committed)}</div><div class="sub">Sales Complete + Closed Won</div></div>
    <div class="card red"><div class="lbl">Behind Pace</div><div class="val">${behind}</div><div class="sub">${urgent} urgent (T-30 behind)</div></div>
    <div class="card amber"><div class="lbl">At Risk Accounts</div><div class="val">${atRiskCount}</div><div class="sub">CS risk flag or overdue AR</div></div>
  </div>

  <div class="charts">
    <div class="chart-box"><h3>Renewals by Product (Open ARR)</h3><div class="chart-wrap"><canvas id="prodChart"></canvas></div></div>
    <div class="chart-box"><h3>Renewals by Stage</h3><div class="chart-wrap"><canvas id="stageChart"></canvas></div></div>
  </div>

  <div class="filters">
    <label>Milestone</label>
    <select id="fMilestone">
      <option value="">All</option>
      <option value="OVERDUE">Overdue</option>
      <option value="T-30">T-30</option>
      <option value="T-60">T-60</option>
      <option value="T-90">T-90</option>
      <option value="T-120">T-120</option>
      <option value="T-145">T-145</option>
      <option value="Early">Early</option>
    </select>
    <label>Product</label>
    <select id="fProduct"><option value="">All</option>${prodLabels.map(p=>`<option value="${p}">${p}</option>`).join("")}</select>
    <label>Stage</label>
    <select id="fStage"><option value="">All</option>${stageLabels.map(s=>`<option value="${s}">${s}</option>`).join("")}</select>
    <label>Owner</label>
    <select id="fOwner"><option value="">All</option></select>
    <button class="flt-btn" id="fBehind">Behind Only</button>
    <button class="flt-btn" id="fRisk">At Risk Only</button>
  </div>

  <div class="tbl-box" id="tblBox"></div>`;

  // Restore saved filters
  if(saved.milestone) document.getElementById("fMilestone").value=saved.milestone;
  if(saved.product)   document.getElementById("fProduct").value=saved.product;
  if(saved.stage)     document.getElementById("fStage").value=saved.stage;
  if(saved.owner)     document.getElementById("fOwner").value=saved.owner;
  if(saved.behind)    document.getElementById("fBehind").classList.add("active");
  if(saved.risk)      document.getElementById("fRisk").classList.add("active");

  // Owner dropdown grouped by manager
  const ownerSel=document.getElementById("fOwner");
  Object.keys(MANAGER_MAP).sort().forEach(mgr=>{
    const members=(MANAGER_MAP[mgr]||[]).filter(n=>liveOwners.includes(n));
    if(!members.length) return;
    ownerSel.add(new Option("👥 "+mgr+" (Whole Team)","mgr:"+mgr));
    members.sort().forEach(n=>ownerSel.add(new Option("    "+n,n)));
  });
  if(saved.owner) ownerSel.value=saved.owner;

  // Charts
  applyChartDefaults();
  mkChart("prodChart",{type:"bar",data:{labels:prodLabels,datasets:[{data:prodLabels.map(p=>byProduct[p]),minBarLength:4,backgroundColor:_dm?mkStripes("#3B2845","#F58220"):"#F58220",borderColor:"transparent",borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>" "+fmtK(c.parsed.y)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmtK(v)}}}}});
  mkChart("stageChart",{type:"bar",data:{labels:stageLabels,datasets:[{data:stageLabels.map(s=>byStage[s]),minBarLength:4,backgroundColor:_dm?"#F58220":"#3B2845",borderColor:"transparent",borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});

  // Filter & table
  function applyFilters(){
    const fm=document.getElementById("fMilestone")?.value||"";
    const fp=document.getElementById("fProduct")?.value||"";
    const fs=document.getElementById("fStage")?.value||"";
    const fo=document.getElementById("fOwner")?.value||"";
    const fb=document.getElementById("fBehind")?.classList.contains("active");
    const fr=document.getElementById("fRisk")?.classList.contains("active");
    _savedFilters={milestone:fm,product:fp,stage:fs,owner:fo,behind:fb,risk:fr};

    let rows=enriched.filter(r=>{
      if(fm&&r._milestone.label!==fm) return false;
      if(fp&&r.product!==fp) return false;
      if(fs?r.stage!==fs:(r.stage==="Closed Won"||r.stage==="Closed Lost")) return false;
      if(fo){
        if(fo.startsWith("mgr:")){const mgr=fo.slice(4);if(!(MANAGER_MAP[mgr]||[]).includes(r.owner))return false;}
        else if(r.owner!==fo) return false;
      }
      if(fb&&!r._behind) return false;
      if(fr&&!r.atRisk&&!r.overdueAR) return false;
      return true;
    });

    const h=gridjs.html;
    const M_ORDER={"OVERDUE":0,"T-30":1,"T-60":2,"T-90":3,"T-120":4,"T-145":5,"Early":6};
    const CONF_ORDER={"At Risk":0,"Watch":1,"On Track":2,"Committed":3,"Closed Won":4};
    const PACE_ORDER={"Behind":0,"N/A":1,"On Track":2};

    // Each badge cell is {s: sortKey, label, css} so formatter and sorter both work after re-sort
    const data=rows.map(r=>[
      r.account,
      r.product||"—",
      r.stage||"—",
      {s:M_ORDER[r._milestone.label]??9, label:r._milestone.label, css:r._milestone.css},
      {s:PACE_ORDER[r._pace.label]??9,   label:r._pace.label,      css:r._pace.css},
      {s:CONF_ORDER[r._confidence.label]??9, label:r._confidence.label, css:r._confidence.css},
      {s:r.atRisk?0:1, label:r.atRisk?"⚠ Risk":"OK", css:r.atRisk?"badge-risk":"badge-ok"},
      {s:r.overdueAR||0, label:r.overdueAR>0?fmtK(r.overdueAR):"—", css:r.overdueAR>0?"badge-ar":"badge-ok"},
      r.arr,
      r.upliftI||0,
      r.upliftR||0,
      r.close||"",
      r._daysUntil,
      r.owner,
    ]);

    const badgeFmt = cell => h(`<span class="badge ${cell.css}">${cell.label}</span>`);
    const badgeSort = {compare:(a,b)=>a.s-b.s};

    if(_charts._grid){try{_charts._grid.destroy();}catch(_){} delete _charts._grid;}
    const g=new gridjs.Grid({
      columns:[
        {name:"Account",width:"14%"},
        {name:"Product",width:"9%"},
        {name:"Stage",width:"11%"},
        {name:"Milestone",  width:"7%", formatter:badgeFmt, sort:badgeSort},
        {name:"Pace",       width:"7%", formatter:badgeFmt, sort:badgeSort},
        {name:"Confidence", width:"9%", formatter:badgeFmt, sort:badgeSort},
        {name:"At Risk",    width:"6%", formatter:badgeFmt, sort:badgeSort},
        {name:"Overdue AR", width:"8%", formatter:badgeFmt, sort:badgeSort},
        {name:"ARR",        width:"7%", formatter:v=>fmtK(v), sort:{compare:(a,b)=>a-b}},
        {name:"Int. Uplift",width:"7%", formatter:v=>v?`${v}%`:"—", sort:{compare:(a,b)=>a-b}},
        {name:"Real. Uplift",width:"7%",formatter:v=>v?`${v}%`:"—", sort:{compare:(a,b)=>a-b}},
        {name:"Close Date", width:"9%", formatter:v=>fmtDt(v)},
        {name:"Days",       width:"5%", formatter:v=>`${v>=0?"":"−"}${Math.abs(v)}d`, sort:{compare:(a,b)=>a-b}},
        {name:"Owner",      width:"9%"},
      ],
      data,
      search:true,
      sort:true,
      pagination:{limit:20},
      fixedHeader:true,
      height:"460px",
    });
    g.render(document.getElementById("tblBox"));
    _charts._grid=g;
  }

  applyFilters();

  ["fMilestone","fProduct","fStage","fOwner"].forEach(id=>{
    document.getElementById(id)?.addEventListener("change",applyFilters);
  });
  ["fBehind","fRisk"].forEach(id=>{
    document.getElementById(id)?.addEventListener("click",function(){
      this.classList.toggle("active");
      applyFilters();
    });
  });
}

// ── Init ───────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded",function(){
  applyChartDefaults();
  populateQuarterDropdown();
  document.getElementById("windowSel").value=String(DAYS_WINDOW);
  const darkBtn=document.getElementById("darkBtn");
  if(darkBtn&&document.documentElement.classList.contains("dark")) darkBtn.textContent="☀ Light";
  render();
});
</script>
</body>
</html>
